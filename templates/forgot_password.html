{% extends "base.html" %}
{% block title %}Forgot Password – SCAAS{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 60px);background:var(--bg2);display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:420px;">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="width:52px;height:52px;background:var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 0.75rem;font-size:1.4rem;">🔑</div>
      <h1 style="font-size:1.5rem;font-weight:800;">Forgot Password</h1>
      <p style="color:var(--text2);font-size:0.875rem;margin-top:4px;">Enter your email and we'll send a reset link</p>
    </div>
    <div class="card">
      <div class="card-body">
        <div id="success-box" style="display:none;" class="alert alert-success" style="margin-bottom:1rem;"></div>
        <div class="form-group">
          <label class="form-label">Account Type</label>
          <select id="role" class="form-select">
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Registered Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="your@university.edu" onkeydown="if(event.key==='Enter')sendReset()">
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" onclick="sendReset()" id="reset-btn">
          Send Reset Link
        </button>
        <div class="divider"></div>
        <p style="text-align:center;font-size:0.875rem;color:var(--text2);">
          Remember your password? <a href="/login" style="color:var(--primary);font-weight:600;text-decoration:none;">Login here</a>
        </p>
      </div>
    </div>
    <p style="text-align:center;font-size:0.78rem;color:var(--text3);margin-top:1rem;">
      <a href="/admin/login" style="color:var(--text2);text-decoration:none;">Admin Login →</a>
    </p>
  </div>
</div>
<script>
async function sendReset() {
  const btn = document.getElementById('reset-btn');
  const email = document.getElementById('email').value.trim();
  const role  = document.getElementById('role').value;
  if(!email){ showToast('Please enter your email address.','error'); return; }
  btn.textContent = 'Sending...'; btn.disabled = true;
  try {
    const r = await fetch('/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, role})
    });
    const d = await r.json();
    if(d.success) {
      document.getElementById('success-box').style.display = 'block';
      document.getElementById('success-box').innerHTML =
        '✅ ' + d.message + '<br><small style="color:var(--text2);">Check your spam folder if you don\'t see it within 2 minutes.</small>';
      btn.textContent = '✅ Link Sent!';
    } else {
      showToast(d.message, 'error');
      btn.textContent = 'Send Reset Link'; btn.disabled = false;
    }
  } catch(e) {
    showToast('Network error. Please try again.', 'error');
    btn.textContent = 'Send Reset Link'; btn.disabled = false;
  }
}
</script>
{% endblock %}
